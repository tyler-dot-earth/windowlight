[package]
name = "windowlight"
version = "0.1.0"
edition = "2021"

[dependencies]
smithay-client-toolkit = { version = "0.19", default-features = false }
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-egl = "0.32"
wayland-protocols = { version = "0.32", features = ["client"] }
khronos-egl = { version = "6", features = ["dynamic"] }
glow = "0.16"
chrono = "0.4"
serde_json = "1"
png = "0.17"
libc = "0.2"

[profile.release]
opt-level = 3
